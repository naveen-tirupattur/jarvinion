[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "feedwise"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "feedparser>=6.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.scripts]
feedwise = "feedwise.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/feedwise"]

[dependency-groups]
dev = ["pytest>=8.0"]
